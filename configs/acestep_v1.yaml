# ============================================================
# ACE-Step v1 Phase-A training config (8 × A100-80GB, FSDP)
# ============================================================
# Reference: https://github.com/ACE-Step/ACE-Step (Apache 2.0)
# Usage:
#   torchrun --nproc_per_node=8 src/train/main.py --config configs/acestep_v1.yaml
# ============================================================
name: acestep_v1_phase_a
seed: 42
output_dir: /data/t2music/runs/${name}

# ---------- model ----------
model:
  name: acestep_v1
  # Components:
  #   DCAE      - deep compression autoencoder (f8c8)
  #   DiT       - diffusion transformer renderer
  #   vocoder   - ADaMS-HiFiGAN 48kHz
  pretrained: /data/t2music/pretrained/acestep_v1   # local path or HF identifier
  dtype: bf16
  freeze_backbone: false
  # Phase A: train DCAE + DiT end-to-end on short clips
  lora:
    enabled: false

# ---------- data ----------
data:
  train:
    - type: csv_audio
      audio_dir: /data/t2music/raw/musiccaps
      csv_path: /data/t2music/raw/musiccaps/musiccaps.csv
      csv_caption_column: caption
      csv_id_column: ytid
      ext: .wav
      sampling_rate: 48000
      duration: 10
      weight: 1.0
    - type: dir_audio
      audio_dir: /data/t2music/raw/fma/previews_30s
      sampling_rate: 48000
      duration: 10
      weight: 0.5
  val:
    - type: csv_audio
      audio_dir: /data/t2music/raw/musiccaps
      csv_path: /data/t2music/raw/musiccaps/musiccaps.csv
      csv_caption_column: caption
      csv_id_column: ytid
      ext: .wav
      sampling_rate: 48000
      duration: 10
  num_workers: 16
  prefetch_factor: 4
  pin_memory: true
  dataset_fingerprint:
    - /data/t2music/_spec/musiccaps.fingerprint.json

# ---------- training ----------
training:
  # ACE-Phase has two stages; Stage A = DCAE, Stage B = DiT
  stage: A
  max_steps:
    A: 10000
    B: 50000
  warmup_steps: 500
  batch_size_per_gpu:
    A: 8
    B: 2
  grad_accum:
    A: 1
    B: 4
  max_grad_norm: 1.0
  adam:
    lr: 2.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.0
  scheduler: cosine
  checkpoint_every: 1000
  resume: true
  log_every: 100
  eval_every: 500

# ---------- flow matching ----------
flow_matching:
  sigma_min: 0.0
  sigma_max: 1.0
  # REPA semantic alignment (ACE-Step v1 validated)
  repa:
    enabled: true
    feature_layer: "block20"
    model_name: "m-a-p/MERT-v1-330M"
    loss_weight: 0.1

# ---------- distributed ----------
distributed:
  backend: nccl
  fsdp: true
  fsdp_sharding: full_shard
  fsdp_cpu_offload: false
  fsdp_mixed_precision: bf16
  activation_checkpointing: true
  compile: true

# ---------- validation / generation ----------
inference:
  num_prompts_per_eval: 5
  guidance_scale: 3.5
  num_inference_steps: 50    # DMD2 distills to 4-8 steps later
  seed: 42

# ---------- logging ----------
logging:
  backend: wandb
  project: t2music-phase-a
  entity: t2music-team
  log_dir: /data/t2music/logs/${name}
  save_code: true

# ---------- reproducibility ----------
reproducibility:
  deterministic_algorithms: false
  benchmark_cudnn: true
  sha256_lock: true
